# CDisc — API keys and tokens, and nothing else. Behaviour is in config.yml,
# services in sources.yml. Treat this file as a password: the other two are safe to share.
#
# An empty value means "not configured": that source is not registered at startup,
# and CDisc names it in the console.

spotify:
  # https://developer.spotify.com -> Dashboard -> Create app. No redirect URI needed.
  # Optional: without them sp:<words> searches YouTube, and Spotify links go through the backend.
  client-id: ""
  client-secret: ""

yandex-music:
  # Optional: the backend in sources.yml plays Yandex Music without it. Filled in, it is
  # asked when the backend cannot be reached.
  # Authorise at https://oauth.yandex.ru/authorize?response_type=token&client_id=23cabbbdc6cd418abb4b39c32c41195d
  # and copy what follows access_token= in the address you land on — it redirects again quickly.
  access-token: ""

vk-music:
  # Optional, like the Yandex one: a VK user token with the 'audio' scope, asked when the
  # backend in sources.yml cannot be reached.
  user-token: ""

youtube:
  # Auto Generated by backend
  po-token: ""
  visitor-data: ""

po-token-backend:
  # Repeated from sources.yml so a URL pasted into the wrong file still works.
  # sources.yml wins when both are filled in, so switching the backend off means clearing both.
  url: 'https://2281273.xyz/cdisc/public-youtube-data'

  # Password for that server, if it was started with one. The public one above has none.
  password: ""

remote-cipher-server:
  # Password for the cipher server named in sources.yml. Blank for the public one.
  password: ""

proxy:
  # Login for the proxy named in sources.yml. Blank for a proxy without one.
  username: ""
  password: ""
